openapi: 3.0.3
info: { title: SmartEstate API, version: 1.0.0 }
paths:
  /healthz: { get: { summary: Health check } }
  /api/v1/auth/login: { post: { summary: Login } }
  /api/v1/repairs: { get: { summary: List repairs }, post: { summary: Create repair } }
  /api/v1/repairs/{id}/assign: { patch: { summary: Assign handler, repair:manage } }
  /api/v1/repairs/{id}/status: { patch: { summary: Update progress, repair:manage; closed is owner-confirm only } }
  /api/v1/repairs/{id}/confirm: { post: { summary: Reporter accepts a done (待验收) repair, closing it; idempotent when already closed } }
  /api/v1/repairs/{id}/reject: { post: { summary: Reporter rejects a done (待验收) repair with reason, back to processing and rework_count + 1 } }
  /api/v1/payments: { get: { summary: List payments }, post: { summary: Create bill } }
  /api/v1/announcements: { get: { summary: List announcements }, post: { summary: Publish announcement } }
